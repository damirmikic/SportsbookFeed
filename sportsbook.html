<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sportsbook Hub</title>
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
  <link rel="shortcut icon" href="/favicon.svg?v=2" type="image/svg+xml" />
  <link rel="stylesheet" href="/sportsbook.css" />
</head>
<body>
  <div class="shell">

    <header class="topbar">
      <div class="brand">
        <span class="brand-kicker">Live Odds</span>
        <span class="brand-title">Feed Project</span>
      </div>
      <div class="topbar-pills">
        <div class="pill"><strong id="leagueTotal">0</strong>&nbsp;leagues</div>
        <div class="pill"><strong id="matchTotal">0</strong>&nbsp;matches</div>
        <div class="pill pill-status" id="generatedStatus">Loading…</div>
        <div class="pill pill-countdown" id="countdownPill" style="display:none">
          <span id="countdownVal" class="cd-low">reconnecting…</span>
        </div>
        <div class="trader-panel">
          <label class="trader-name-field" for="traderNameInput">
            <span>Trader</span>
            <input id="traderNameInput" type="text" maxlength="32" placeholder="trader name" />
          </label>
          <label class="ratio-field" for="firstHalfRatioInput">
            <span>1H Split</span>
            <input id="firstHalfRatioInput" type="number" min="0.05" max="0.95" step="0.01" placeholder="0.45" />
            <small id="secondHalfRatioLabel">2H 0.55</small>
          </label>
          <div class="filter-chip-group" id="traderFilterGroup">
            <button class="filter-chip is-active" type="button" data-filter-mode="all">All</button>
            <button class="filter-chip" type="button" data-filter-mode="suspended">Suspended</button>
            <button class="filter-chip" type="button" data-filter-mode="manual">Manual</button>
            <button class="filter-chip" type="button" data-filter-mode="overrides">Overrides</button>
          </div>
        </div>
        <button class="refresh-btn" id="refreshBtn" type="button" title="Refresh now">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 4v4h4"/><path d="M15 12v-4h-4"/>
            <path d="M13.5 6A6 6 0 1 0 14 10"/>
          </svg>
          Refresh
        </button>
      </div>
    </header>

    <div class="layout">

      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-title">Leagues</div>
          <div class="sidebar-sub">Select a competition to view fixtures</div>
        </div>
        <div class="search-wrap">
          <input id="searchInput" class="search-input" type="search" placeholder="Search leagues…" />
        </div>
        <div id="leagueGroups" class="league-groups"></div>
      </aside>

      <main class="main">
        <div class="league-hero" id="leagueHero">
          <span class="hero-name" id="heroTitle">Select a league</span>
          <span class="hero-badge" id="heroSource">—</span>
          <div class="hero-meta">
            <span><strong id="heroMatchCount">0</strong> matches</span>
          </div>
        </div>

        <div class="content" id="mainContent">
          <div class="empty-state">
            <strong>No league selected</strong>
            Choose a competition from the sidebar.
          </div>
        </div>
      </main>

    </div>
  </div>

    <script src="/sportsbook-app.js"></script>
</body>
</html>
