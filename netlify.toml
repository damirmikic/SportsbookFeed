[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from   = "/api/leagues"
  to     = "https://www.pinnacle888.com/sports-service/sv/euro/leagues"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/odds/event/:id"
  to     = "https://www.pinnacle888.com/sports-service/sv/euro/odds/event?eventId=:id"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/odds/:code"
  to     = "https://www.pinnacle888.com/sports-service/sv/euro/odds/league?leagueCode=:code"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/traders"
  to     = "/.netlify/functions/traders"
  status = 200

[[redirects]]
  from   = "/api/shared-state"
  to     = "/.netlify/functions/shared-state"
  status = 200

[[redirects]]
  from   = "/api/trader-state"
  to     = "/.netlify/functions/trader-state"
  status = 200

[[redirects]]
  from   = "/api/trader-presence"
  to     = "/.netlify/functions/trader-presence"
  status = 200

[[redirects]]
  from   = "/api/audit-log"
  to     = "/.netlify/functions/audit-log"
  status = 200

[[redirects]]
  from   = "/api/odds-history"
  to     = "/.netlify/functions/odds-history"
  status = 200

[[redirects]]
  from   = "/api/manual-data"
  to     = "/.netlify/functions/manual-data"
  status = 200

[[redirects]]
  from   = "/api/offer"
  to     = "/.netlify/functions/offer"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin  = "http://localhost:5173"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
