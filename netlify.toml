[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from   = "/api/leagues"
  to     = "https://www.pinnacle888.com/sports-service/sv/euro/leagues?sportId=29&locale=en_US&withCredentials=true"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/odds/event/:id"
  to     = "https://www.pinnacle888.com/sports-service/sv/euro/odds/event?eventId=:id&oddsType=1&locale=en_US&withCredentials=true"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/odds/:code"
  to     = "https://www.pinnacle888.com/sports-service/sv/euro/odds/league?sportId=29&oddsType=1&version=0&periodNum=-1&locale=en_US&leagueCode=:code&isHlE=true&isLive=false&eventType=0&withCredentials=true"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/traders"
  to     = "/.netlify/functions/traders"
  status = 200

[[redirects]]
  from   = "/api/shared-state"
  to     = "/.netlify/functions/shared-state"
  status = 200

[[redirects]]
  from   = "/api/trader-state"
  to     = "/.netlify/functions/trader-state"
  status = 200

[[redirects]]
  from   = "/api/trader-presence"
  to     = "/.netlify/functions/trader-presence"
  status = 200

[[redirects]]
  from   = "/api/audit-log"
  to     = "/.netlify/functions/audit-log"
  status = 200

[[redirects]]
  from   = "/api/odds-history"
  to     = "/.netlify/functions/odds-history"
  status = 200
