<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sportsbook Trading Terminal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
  <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-content">
        <h1 id="org-name">Sportsbook Feed</h1>
        <p>Trading Terminal</p>
      </div>
      <nav class="view-nav">
        <button type="button" class="view-nav-btn active" data-view="trading">Trading</button>
        <button type="button" class="view-nav-btn" data-view="admin">Admin</button>
      </nav>
      <button type="button" id="trader-chip" class="trader-chip" title="Click to sign out">
        <span class="trader-chip-dot"></span>
        <span class="trader-chip-name">Operator</span>
        <span class="trader-chip-role"></span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <div class="status-indicator">
        <span id="last-refresh"></span>
        <span class="pulse"></span> Live
      </div>
      <div id="sync-status" class="sync-status saved" aria-live="polite">Saved</div>
    </header>

    <div id="sync-failure-banner" class="sync-failure-banner hidden" role="status">
      <span>Data sync failed — working with last saved state.</span>
      <button type="button" id="sync-failure-dismiss" aria-label="Dismiss sync warning">Dismiss</button>
    </div>

    <!-- ── Trading view ── -->
    <main id="trading-view" class="bento-layout">
      <aside class="panel leagues-panel">
        <div class="panel-header-alt">
          <div class="leagues-title-row">
            <h2>Leagues</h2>
            <div class="sport-selector">
              <button type="button" class="sport-tab active" data-sport-id="29" title="Soccer">⚽</button>
              <button type="button" class="sport-tab" data-sport-id="4" title="Basketball">🏀</button>
            </div>
          </div>
          <div class="search-box">
            <input type="text" id="league-search" placeholder="Search leagues, countries, teams..." autocomplete="off">
          </div>
        </div>
        <div id="favorites-container" class="favorites-section"></div>
        <div id="leagues-container" class="scrollable">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading leagues...</p>
          </div>
        </div>
      </aside>
      <section class="panel market-panel">
        <h2>Market Board <span id="current-league"></span></h2>
        <div id="odds-container" class="scrollable">
          <div class="empty-state">Select a league to view odds</div>
        </div>
      </section>
    </main>

    <!-- ── Admin view ── -->
    <div id="admin-view" class="admin-view hidden">

      <!-- Admin section sub-nav -->
      <nav class="admin-section-nav">
        <button type="button" class="admin-section-btn active" data-section="tournaments">Soccer Prematch</button>
        <button type="button" class="admin-section-btn" data-section="tournaments-basketball">Basketball Prematch</button>
        <button type="button" class="admin-section-btn" data-section="templates">My Templates</button>
        <button type="button" class="admin-section-btn" data-section="custom-leagues">Custom Leagues</button>
        <button type="button" class="admin-section-btn" data-section="audit">Audit Log</button>
        <button type="button" class="admin-section-btn hidden" data-section="operators">Operators</button>
      </nav>

      <!-- Tournaments panel -->
      <div id="admin-panel"></div>

      <!-- Templates panel -->
      <div id="templates-panel" class="hidden"></div>

      <!-- Audit panel -->
      <div id="audit-panel" class="hidden"></div>

      <!-- Operators panel (owner-only) -->
      <div id="operators-panel" class="hidden"></div>

      <!-- Custom Leagues panel -->
      <div id="manual-leagues-panel" class="hidden"></div>

    </div>

    <!-- Side Drawer -->
    <div id="drawer-overlay" class="drawer-overlay"></div>
    <aside id="side-drawer" class="side-drawer">
      <div class="drawer-header">
        <div class="drawer-title">
          <h2 id="drawer-match-name">Match Details</h2>
          <p id="drawer-match-time">Kick-off Time</p>
        </div>
        <div class="drawer-actions">
          <button type="button" id="suspend-event-btn" class="suspend-btn open" title="Suspend entire event">🔓</button>
          <button type="button" id="trading-mode-btn" class="mode-btn auto" title="Edit any price to enter MANUAL mode">● AUTO</button>
          <button type="button" id="close-drawer" class="close-btn">&times;</button>
        </div>
      </div>
      <div id="drawer-content" class="scrollable"></div>
    </aside>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
